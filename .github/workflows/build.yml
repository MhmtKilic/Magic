name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: |
          rm $GITHUB_WORKSPACE/builds/*.cs3 || true
          rm $GITHUB_WORKSPACE/builds/*.json || true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Plugins
        working-directory: ${{ github.workspace }}/src
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson
          
          find . -name "*.cs3" -exec cp {} ${{ github.workspace }}/builds/ \;
          find . -name "plugins.json" -exec cp {} ${{ github.workspace }}/builds/ \;
          find . -name "repo.json" -exec cp {} ${{ github.workspace }}/builds/ \;

      - name: Push builds
        working-directory: ${{ github.workspace }}/builds
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          
          if git diff --staged --quiet; then
            echo "Değişiklik yok, atlanıyor."
            exit 0
          fi
          
          git commit -m "Auto Build ${{ github.sha }}"
          git push origin builds --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            ${{ github.workspace }}/builds/*.cs3
            ${{ github.workspace }}/builds/*.json
